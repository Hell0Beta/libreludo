<!-- Interactive Micro-Interactions Script for Audio and Tactile Feedback -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // Tactile stone button click sounds (visual pulse feedback)
      const stoneButtons = document.querySelectorAll('.stone-button');
      stoneButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          btn.style.transform = 'translateY(4px)';
          setTimeout(() => {
            btn.style.transform = '';
          }, 120);
        });
      });

      // Quick room code validator uppercase formatter
      const codeInput = document.getElementById('room-code-input');
      if (codeInput) {
        codeInput.addEventListener('input', (e) => {
          e.target.value = e.target.value.toUpperCase();
        });
      }
    });
  </script>
